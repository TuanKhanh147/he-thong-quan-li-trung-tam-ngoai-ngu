<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý Khóa học</title><link rel="stylesheet" href="../assets/style.css"></head>
<body class="admin-body"><div id="sidebar"></div>
<main class="admin-main"><div class="topbar"><button class="mobile-menu" onclick="toggleSidebar()">☰</button><div>🏫 <b>Quản lý Khóa học</b></div><a href="#" onclick="logout()">Đăng xuất</a></div>
<div class="page-title"><div><h1>📚 Quản lý Khóa học</h1><p class="muted">Thêm, sửa, xóa và tìm kiếm dữ liệu trực tiếp trên trình duyệt.</p></div><button class="primary-btn" onclick="openForm()">+ Thêm mới</button></div>
<div class="panel"><div class="toolbar"><input id="searchBox" placeholder="🔎 Tìm kiếm..." oninput="renderTable()"><button class="secondary-btn" onclick="exportCSV()">Xuất CSV</button><button class="secondary-btn" onclick="resetData()">Khôi phục dữ liệu mẫu</button></div>
<div class="table-wrap"><table><thead><tr><th>Mã</th><th>Tên khóa học</th><th>Trình độ</th><th>Thời lượng</th><th>Học phí</th><th>Thao tác</th></tr></thead><tbody id="dataTable"></tbody></table></div></div>
<div id="modal" class="modal"><div class="modal-content"><div class="modal-head"><h2 id="modalTitle">Thêm mới</h2><button onclick="closeForm()">×</button></div>
<form id="dataForm" class="form-grid"><label>Mã<input name="id" placeholder="Tự động nếu để trống"></label><label>Tên khóa học<input name="name" required></label><label>Trình độ<input name="level" required></label><label>Thời lượng<input name="duration" required></label><label>Học phí<input name="fee" required></label><div class="form-actions"><button type="button" class="secondary-btn" onclick="closeForm()">Hủy</button><button class="primary-btn" type="submit">Lưu dữ liệu</button></div></form></div></div>
</main><script src="../assets/app.js"></script><script>
requireAdmin(); renderSidebar('courses'); initCrud('course', ["id", "name", "level", "duration", "fee"]); 
</script></body></html>
