<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lịch Học</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="admin-body">
    <div id="sidebar">

    </div>
<main class="admin-main">
    <div class="topbar">
        <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
        <div>🏫 <b>Lịch Học</b>
        </div><a href="#" onclick="logout()">Đăng xuất</a>
    </div>
<div class="page-title">
    <div>
        <h1>🗓️ Lịch Học</h1>
        <p class="muted">Thêm, sửa, xóa và tìm kiếm dữ liệu trực tiếp trên trình duyệt.</p>
    </div>
    <button class="primary-btn" onclick="openForm()">+ Thêm mới</button>
</div>
<div class="panel">
    <div class="toolbar">
        <input id="searchBox" placeholder="🔎 Tìm kiếm..." oninput="renderTable()">
        <button class="secondary-btn" onclick="exportCSV()">Xuất CSV</button>
        <button class="secondary-btn" onclick="resetData()">Khôi phục dữ liệu mẫu</button>
    </div>
<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>Mã</th>
                <th>Lớp</th>
                <th>Thứ</th>
                <th>Giờ</th>
                <th>Phòng</th>
                <th>Giảng viên</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="dataTable">

        </tbody>
    </table>
</div>
</div>
<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-head">
            <h2 id="modalTitle">Thêm mới</h2>
            <button onclick="closeForm()">×</button>
        </div>
<form id="dataForm" class="form-grid">
    <label>Mã<input name="id" placeholder="Tự động nếu để trống">
    </label>
    <label>Lớp<input name="className" required>
    </label>
    <label>Thứ<input name="day" required>
    </label>
    <label>Giờ<input name="time" required>
    </label>
    <label>Phòng<input name="room" required>
    </label>
    <label>Giảng viên<input name="teacher" required>
    </label>
    <div class="form-actions">
        <button type="button" class="secondary-btn" onclick="closeForm()">Hủy</button>
        <button class="primary-btn" type="submit">Lưu dữ liệu</button>
    </div>
</form>
</div>
</div>
</main>
<script src="../assets/app.js">

</script>
<script>
requireAdmin(); renderSidebar('schedule'); initCrud('schedule', ["id", "className", "day", "time", "room", "teacher"]); 
</script>
</body>
</html>
